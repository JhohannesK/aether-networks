name: CI

# main is production. dev is integration. Pull requests target dev.
# This job stays on the mock path: no SOLARI_API_KEY and no repository secrets.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/aether-network
    env:
      SOLARI_API_KEY: ""
      AETHER_MASTER_SEED: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        # package-lock.json is gitignored, so install from package.json.
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
